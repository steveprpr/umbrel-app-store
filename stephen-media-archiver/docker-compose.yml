version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: stephen-media-archiver_server_1
      APP_PORT: 8080
      PROXY_AUTH_WHITELIST: "/api/status,/api/metrics,/metrics,/health"

  server:
    image: python:3.12-alpine
    restart: on-failure
    # Umbrel updates replace only this compose file and the manifest, never app/ files, so each
    # version fetches its script from this repo at a pinned commit and checks its SHA-256.
    # If GitHub can't be reached, it falls back to the copy installed in app/ (may be older).
    command:
      - sh
      - -c
      - >-
        if wget -qO /tmp/archiver.py "https://raw.githubusercontent.com/steveprpr/umbrel-app-store/31390ab5841a113021cb6225e56123f054da902e/stephen-media-archiver/app/archiver.py"
        && echo "ca88bf943dcac0628025110d8f6ed998693ce67a97466fe343071b6af46c91f4  /tmp/archiver.py" | sha256sum -c - >/dev/null;
        then exec python -u /tmp/archiver.py;
        else echo "WARNING: pinned download failed or hash mismatch; running installed copy"; exec python -u /app/archiver.py; fi
    environment:
      - TZ=America/New_York
      # Plans and reports only. Set to "false" (and bump the app version) to let it move files.
      - DRY_RUN=true
      - TRIGGER_FREE_GB=300
      - TARGET_FREE_GB=400
      - MAX_GB_PER_RUN=40
      - ARCHIVE_RESERVE_GB=150
      - MOVIE_MIN_DAYS=60
      - SERIES_MIN_DAYS=90
      - KEEP_TAG=keep
      - RUN_AT=03:30
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
      # Read-only: lets it check hardlink counts, so it knows what a move really frees.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
      # API keys are read from each app's own config, so no secrets live in this repo.
      - ${UMBREL_ROOT}/app-data/stephen-radarr/data/config/config.xml:/keys/radarr/config.xml:ro
      - ${UMBREL_ROOT}/app-data/stephen-sonarr/data/config/config.xml:/keys/sonarr/config.xml:ro
      - ${UMBREL_ROOT}/app-data/bazarr/data/config/config/config.yaml:/keys/bazarr/config.yaml:ro
      # Jellyfin key "media-archiver" is read from a temp copy of Jellyfin's database.
      - ${UMBREL_ROOT}/app-data/jellyfin/data/config/data/data:/keys/jellyfin:ro
