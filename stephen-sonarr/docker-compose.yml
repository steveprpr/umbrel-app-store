version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: stephen-sonarr_server_1
      APP_PORT: 8989
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: linuxserver/sonarr:4.0.20@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Overflow library on the WD USB drive (ext4). Not auto-created: if the drive is missing, the app will not start rather than write to the internal disk.
      - type: bind
        source: "${UMBREL_ROOT}/external/WD USB/Media Archive"
        target: /archive
        bind:
          create_host_path: false
    restart: on-failure
