version: "3.7"

services:
  app_proxy:
    environment:
      # qBittorrent shares Gluetun's network namespace, so the proxy targets Gluetun.
      APP_HOST: stephen-qbittorrent-vpn_gluetun_1
      APP_PORT: 8090
      PROXY_AUTH_WHITELIST: "/api/*"

  gluetun:
    image: qmcgaw/gluetun:v3
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      # Credentials are read from /run/secrets/openvpn_user and /run/secrets/openvpn_password.
      - SERVER_REGIONS=CA Montreal,CA Toronto
      - PORT_FORWARD_ONLY=on
      # PIA 'strong' encryption UDP port.
      - OPENVPN_ENDPOINT_PORT=1197
      # Gluetun's bundled PIA list goes stale (Montreal IPs moved Nov 2026); refresh from PIA at start and daily.
      - UPDATER_PERIOD=24h
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8090/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8090/api/v2/app/setPreferences'
      # Web UI reached only through Umbrel's app proxy and by Sonarr/Radarr on the Docker network.
      # 8090 qBittorrent UI, 8888 HTTP proxy (Prowlarr), 8191 FlareSolverr: reachable from the Docker network only.
      - FIREWALL_INPUT_PORTS=8090,8888,8191
      # HTTP proxy so Prowlarr's indexer searches also leave via PIA.
      - HTTPPROXY=on
      - HTTPPROXY_LOG=off
      - TZ=America/New_York
    volumes:
      - ${APP_DATA_DIR}/gluetun:/gluetun
      # PIA credentials live outside app-data so reinstall/uninstall can't wipe them.
      - ${UMBREL_ROOT}/secrets/pia:/run/secrets:ro
      # Blocks NEW connections from the tunnel namespace to any private range
      # (Docker gateway, Home Assistant on host network, LAN). Replies still flow.
      - ${APP_DATA_DIR}/iptables:/iptables:ro

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    # service_started (not healthy) so install never stalls; Gluetun's firewall is up before the tunnel.
    depends_on:
      - gluetun
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
    volumes:
      - ${APP_DATA_DIR}/qbittorrent:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads

  flaresolverr:
    image: flaresolverr/flaresolverr:v3.4.6@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    # Cloudflare solver for 1337x, inside the VPN namespace like qBittorrent.
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    restart: on-failure
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
