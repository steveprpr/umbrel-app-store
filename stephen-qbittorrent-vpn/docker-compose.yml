version: "3.7"

services:
  app_proxy:
    environment:
      # qBittorrent shares Gluetun's network namespace, so the proxy targets Gluetun.
      APP_HOST: stephen-qbittorrent-vpn_gluetun_1
      APP_PORT: 8090
      PROXY_AUTH_WHITELIST: "/api/*"

  gluetun:
    image: qmcgaw/gluetun:v3
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      # Credentials are read from /run/secrets/openvpn_user and /run/secrets/openvpn_password.
      - SERVER_REGIONS=CA Montreal,CA Toronto
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8090/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8090/api/v2/app/setPreferences'
      # Web UI reached only through Umbrel's app proxy and by Sonarr/Radarr on the Docker network.
      - FIREWALL_INPUT_PORTS=8090
      - TZ=America/New_York
    volumes:
      - ${APP_DATA_DIR}/gluetun:/gluetun
      - ${APP_DATA_DIR}/secrets:/run/secrets:ro
      # Blocks NEW connections from the tunnel namespace to any private range
      # (Docker gateway, Home Assistant on host network, LAN). Replies still flow.
      - ${APP_DATA_DIR}/iptables:/iptables:ro

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
    volumes:
      - ${APP_DATA_DIR}/qbittorrent:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
