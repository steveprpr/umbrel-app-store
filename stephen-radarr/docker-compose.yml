version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: stephen-radarr_server_1
      APP_PORT: 7878
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: linuxserver/radarr:6.4.4@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Temporary, read-only: existing WD USB collection for a one-time copy import.
      - "${UMBREL_ROOT}/external/WD USB/Torrents:/usb:ro"
    restart: on-failure
