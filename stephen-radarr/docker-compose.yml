version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: stephen-radarr_server_1
      APP_PORT: 7878
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: linuxserver/radarr:6.4.4@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Overflow library on the WD USB drive (ext4). Not auto-created: if the drive is missing, the app will not start rather than write to the internal disk.
      - type: bind
        source: "${UMBREL_ROOT}/external/WD USB/Media Archive"
        target: /archive
        bind:
          create_host_path: false
    restart: on-failure
